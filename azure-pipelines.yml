# azure-pipelines.yml
#
# Pipeline stages:
#   1. Validate   - terraform fmt/validate + lint app code
#   2. Plan        - terraform plan, published as an artifact for review
#   3. Apply       - terraform apply (manual approval gate via environment)
#   4. Build&Push  - docker build, push image to Docker Hub
#   5. Deploy      - kubectl/helm deploy to AKS, using the cluster Terraform just provisioned
#
# Required pipeline setup (do this in Azure DevOps UI, not in code):
#   - Service connection "azure-subscription-connection" (Service Principal,
#     see terraform/main.tf comment for the az ad sp create-for-rbac command)
#   - Service connection "dockerhub-connection" (Docker Hub username/PAT)
#   - Variable group or secret variables: DOCKERHUB_NAMESPACE
#   - Environment "aks-production" with a manual approval check, so
#     terraform apply never runs unattended against your subscription

trigger:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  terraformWorkingDir: "$(System.DefaultWorkingDirectory)/terraform"
  imageRepository: "$(DOCKERHUB_NAMESPACE)/adep-app"
  dockerfilePath: "$(System.DefaultWorkingDirectory)/app/Dockerfile"
  tag: "$(Build.BuildId)"

stages:
  # ---------------------------------------------------------------
  - stage: Validate
    displayName: "Validate"
    jobs:
      - job: TerraformValidate
        displayName: "Terraform fmt & validate"
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: "1.7.5"

          - script: |
              terraform fmt -check -recursive
              terraform init -backend=false
              terraform validate
            workingDirectory: $(terraformWorkingDir)
            displayName: "terraform fmt / init / validate"

  # ---------------------------------------------------------------
  - stage: Plan
    displayName: "Terraform Plan"
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        displayName: "terraform plan"
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: "1.7.5"

          - task: AzureCLI@2
            displayName: "terraform init & plan"
            inputs:
              azureSubscription: "azure-subscription-connection"
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                export ARM_USE_CLI=false
                cd $(terraformWorkingDir)
                terraform init \
                  -backend-config="client_id=$ARM_CLIENT_ID" \
                  -backend-config="client_secret=$ARM_CLIENT_SECRET" \
                  -backend-config="tenant_id=$ARM_TENANT_ID" \
                  -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
                  -backend-config="use_cli=false"
                terraform plan -out=tfplan \

                  -var="subscription_id=$ARM_SUBSCRIPTION_ID" \
                  -var="alert_email=$ALERT_EMAIL"
            env:
              ALERT_EMAIL: $(ALERT_EMAIL)

          - publish: $(terraformWorkingDir)/tfplan
            artifact: tfplan

  # ---------------------------------------------------------------
  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Plan
    jobs:
      - deployment: TerraformApply
        displayName: "terraform apply (manual approval)"
        environment: "aks-production" # manual approval check lives here
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: "1.7.5"

                - download: current
                  artifact: tfplan

                - task: AzureCLI@2
                  displayName: "terraform init & apply"
                  inputs:
                    azureSubscription: "azure-subscription-connection"
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      export ARM_USE_CLI=false
                      cd $(terraformWorkingDir)
                      terraform init \
                        -backend-config="client_id=$ARM_CLIENT_ID" \
                        -backend-config="client_secret=$ARM_CLIENT_SECRET" \
                        -backend-config="tenant_id=$ARM_TENANT_ID" \
                        -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
                        -backend-config="use_cli=false"
                      terraform apply -auto-approve $(Pipeline.Workspace)/tfplan/tfplan

  # ---------------------------------------------------------------
  - stage: BuildAndPush
    displayName: "Build & Push Image"
    dependsOn: Apply
    jobs:
      - job: DockerBuildPush
        displayName: "docker build & push to Docker Hub"
        steps:
          - task: Docker@2
            displayName: "Build and push"
            inputs:
              containerRegistry: "dockerhub-connection"
              repository: $(imageRepository)
              command: buildAndPush
              Dockerfile: $(dockerfilePath)
              tags: |
                $(tag)
                latest

  # ---------------------------------------------------------------
  - stage: Deploy
    displayName: "Deploy to AKS"
    dependsOn: BuildAndPush
    jobs:
      - deployment: DeployToAKS
        displayName: "kubectl apply to AKS"
        environment: "aks-production"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: "Get AKS credentials"
                  inputs:
                    azureSubscription: "azure-subscription-connection"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group rg-azure-devops-pipeline \
                        --name adep-aks \
                        --overwrite-existing

                - script: |
                    kubectl apply -f k8s/postgres.yaml
                    kubectl set image deployment/adep-app \
                      adep-app=$(imageRepository):$(tag) \
                      --record || kubectl apply -f k8s/deployment.yaml
                    kubectl rollout status deployment/postgres --timeout=120s
                    kubectl rollout status deployment/adep-app --timeout=120s
                  displayName: "Rolling update on AKS"